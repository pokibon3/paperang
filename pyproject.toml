[project]
name = "paperang"
version = "0.1.0"
description = "Paperang サーマルミニプリンタのサンプル (CLI / ライブラリ / MCP サーバー)"
requires-python = ">=3.10"
dependencies = ["pillow>=10.1", "pyserial>=3.5", "bleak>=0.22"]

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
paperang = "paperang.cli:main"
paperang-mcp = "paperang.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paperang"]
